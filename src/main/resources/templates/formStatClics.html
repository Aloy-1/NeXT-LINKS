<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeXT - Statistiques</title>
    <style>
        /* Réinitialisation complète */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Corps de la page immersif */
        body {
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 2rem 1rem;
        }

        /* --- GRAPHISME DE MARQUE NeXT EN ARRIÈRE-PLAN --- */
        .brand-bg-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5rem;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }

        .bg-text-large {
            font-size: 26vw;
            font-weight: 900;
            letter-spacing: -0.6rem;
            color: transparent;
            -webkit-text-stroke: 3px rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
        }

        .bg-text-medium {
            font-size: 11vw;
            font-weight: 800;
            letter-spacing: -0.2rem;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
        }

        /* --- CONTENEUR DU TABLEAU DE BORD CRISTALLIN --- */
        .dashboard-container {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.5rem 2rem;
            border-radius: 28px;
            width: 100%;
            max-width: 800px; /* Plus large pour accueillir confortablement le tableau */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        /* Titre stylisé en dégradé néon */
        h1 {
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        /* Zone de défilement horizontal sécurisée pour mobile */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.4);
        }

        /* --- STYLE DU TABLEAU PREMIUM --- */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #f1f5f9;
            font-size: 0.95rem;
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap; /* Évite les retours à la ligne disgracieux */
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis; /* Coupe les liens trop longs proprement avec "..." */
        }

        /* Effet de survol des lignes du tableau */
        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: rgba(56, 189, 248, 0.04);
        }

        /* Style spécifique pour la colonne des clics */
        .clic-count {
            font-weight: 700;
            color: #34d399; /* Vert émeraude pour les performances de clics */
        }

        /* Message si aucune donnée n'est présente */
        .empty-message {
            color: #94a3b8;
            text-align: center;
            padding: 2rem;
            font-style: italic;
        }

        /* Barre de défilement discrète */
        .table-responsive::-webkit-scrollbar {
            height: 6px;
        }
        .table-responsive::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Adaptations mobile */
        @media (max-width: 640px) {
            .dashboard-container {
                padding: 1.5rem 1rem;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Graphisme de marque en arrière-plan -->
<div class="brand-bg-container">
    <div class="bg-text-medium">NeXT</div>
    <div class="bg-text-large">NeXT</div>
    <div class="bg-text-medium">NeXT</div>
</div>

<!-- Conteneur centralisé des statistiques -->
<div class="dashboard-container">
    <h1>Performances des Liens</h1>
    <p class="subtitle">Analyse en temps réel de l'activité de vos canaux</p>

    <!-- Le tableau s'affiche uniquement si la liste n'est pas vide -->
    <div class="table-responsive" th:if="${not #lists.isEmpty(stats)}">
        <table>
            <thead>
            <tr>
                <th>Lien Youtube</th>
                <th>Canal</th>
                <th>Nombre clics</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat: ${stats}">
                <td th:text="${stat.link}">https://youtube.com</td>
                <td th:text="${stat.canalName}">Canal Principal</td>
                <td class="clic-count" th:text="${stat.clicCount}">142</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Optionnel : bloc affiché si la liste est vide -->
    <div class="empty-message" th:if="${#lists.isEmpty(stats)}">
        Aucune donnée statistique disponible pour le moment.
    </div>
</div>

</body>
</html>
