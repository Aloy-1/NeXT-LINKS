<!DOCTYPE html>
<html lang="fr" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>NeXT</title>
    <style>
        :root{--r:#8B2617;--t:#222;--l:#666;--b:#ccc}
        body{font-family:system-ui,sans-serif;max-width:22rem;margin:auto;padding:1.5rem 1rem;color:var(--t);display:flex;flex-direction:column;gap:1rem;text-align:center}
        h1{color:var(--r);font-size:2.2rem;margin:0;font-weight:800}
        .subtitle{color:var(--l);font-size:.95rem;margin:0}
        form{display:flex;flex-direction:column;gap:1rem;text-align:left}
        #name{width:100%;box-sizing:border-box;font-size:16px;padding:.75rem 1rem;border:1px solid var(--b);border-radius:8px;outline:none}
        #name:focus{border-color:var(--r)}
        form>p{margin:0;font-size:.95rem;font-weight:500}
        .promo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
        .radio-container{position:relative;display:flex}
        .radio-container input[type="radio"]{position:absolute;opacity:0;width:0;height:0}
        .radio-container span{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:1px solid var(--b);border-radius:8px;font-size:.9rem;font-weight:500;cursor:pointer;box-sizing:border-box}
        .radio-container input[type="radio"]:checked+span{background-color:var(--r);color:#fff;border-color:var(--r)}
        .radio-container input[type="radio"]:focus-visible+span{outline:2px solid var(--r)}
        button[type="submit"]{width:100%;height:44px;background-color:var(--r);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:.5rem}
        .footer-text{color:var(--l);font-size:.85rem;margin:0;line-height:1.3}
        hr{border:none;border-top:1px solid #e0e0e0;width:100%;margin:.5rem 0}
        #link{color:var(--l);font-size:.85rem;text-decoration:none}
        .error{color:var(--r);font-size:.8rem;margin:-.5rem 0 0 0}
    </style>
</head>
<body>

<!--/* En-tête du titre principal */-->
<h1>NeXT</h1>

<!--/* Sous-titre explicatif */-->
<p class="subtitle">Dis-nous qui tu es, puis ça s'ouvre.</p>

<!--/* Formulaire principal utilisateur */-->
<form action="#" th:action="@{/register}" th:object="${formInfosUser}" method="post">

    <input id="shortCode" th:field="*{shortCode}" type="hidden" />

    <input id="name" th:field="*{fullName}" placeholder="Ton prénom et ton nom"/>
    <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Erreur</p>

    <p>Tu es en...</p>

    <!--/* Grille de sélection des promotions conforme au design */-->
    <div class="promo-grid">
        <label class="radio-container">
            <input type="radio" id="MSP1" th:field="*{promotion}" value="MSP1">
            <span>MSP 1</span>
        </label>

        <label class="radio-container">
            <input type="radio" id="MSP2" th:field="*{promotion}" value="MSP2">
            <span>MSP 2</span>
        </label>

        <label class="radio-container">
            <input type="radio" id="POLYTECH_OTHER" th:field="*{promotion}" value="POLYTECH_OTHER">
            <span>Polytech, autre</span>
        </label>

        <label class="radio-container">
            <input type="radio" id="NOT_POLYTECH" th:field="*{promotion}" value="NOT_POLYTECH">
            <span>Pas à Polytech</span>
        </label>
    </div>
    <p class="error" th:if="${#fields.hasErrors('promotion')}" th:errors="*{promotion}">Erreur</p>

    <button type="submit">Ouvrir</button>

</form>

<p class="footer-text">On ne publie rien. C'est juste pour savoir à qui on parle.</p>

<hr>

<a id="link" th:href="@{/r/{shortCode}/anonymous(shortCode=${formInfosUser.shortCode})}">continuer sans donner mon nom</a>

</body>
</html>
