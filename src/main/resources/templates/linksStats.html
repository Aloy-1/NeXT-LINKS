<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Liens</title>
    <style>
        :root{--t:#222;--l:#888;--bg:#f5f5f5;--border:#eee;--r:#8B2617;--g:#2e6b3a}
        body{font-family:system-ui,sans-serif;margin:0;color:var(--t)}
        header{background-color:var(--t);color:#fff;padding:.75rem 1rem}
        header>div{max-width:72rem;margin:auto;display:flex;align-items:center;gap:1.5rem}
        header span{font-weight:bold}
        header nav{display:flex;gap:1.5rem}
        header nav a{color:#aaa;text-decoration:none;font-weight:500}
        header nav a[aria-current]{color:#fff;font-weight:bold}
        main{padding:1rem;max-width:72rem;margin:auto}
        .page-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
        h1{font-size:1.8rem;margin:0}
        .btn{display:inline-flex;align-items:center;height:40px;padding:0 1.25rem;border-radius:6px;background:var(--r);color:#fff;font-weight:bold;text-decoration:none;white-space:nowrap}
        .table-wrapper{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:.9rem}
        th{text-align:left;font-size:.75rem;color:var(--l);background-color:var(--bg);padding:.6rem .75rem;border-bottom:1px solid var(--border);font-weight:500;letter-spacing:.05em}
        td{padding:.75rem;border-bottom:1px solid var(--border)}
        td:nth-child(1){color:var(--r);font-family:monospace;white-space:nowrap}
        td:nth-child(2){font-weight:bold}
        td:nth-child(4){color:var(--l);white-space:nowrap}
        td:nth-child(5),td:nth-child(6){font-weight:bold}
        td:nth-child(6){color:var(--g)}
        td:nth-child(7){color:var(--g);font-size:.85rem}
        td.off{color:var(--l)}
        @media (max-width:480px){
            main{padding:.5rem}
            table{font-size:.8rem}
            th,td{padding:.5rem}
        }
    </style>
</head>

<body>

<header>
    <div>
        <span>NeXT Links</span>
        <nav>
            <a th:href="@{/personnes}">Personnes</a>
            <a th:href="@{/liens}" aria-current="page">Liens</a>
        </nav>
    </div>
</header>

<main>
    <div class="page-head">
        <h1>Liens</h1>
        <a class="btn" th:href="@{/liens/nouveau}">Nouveau lien</a>
    </div>

    <div class="table-wrapper" th:if="${not #lists.isEmpty(linksStats)}">
        <table>
            <thead>
            <tr>
                <th>CODE</th>
                <th>TITRE INTERNE</th>
                <th>UE</th>
                <th>PUBLIÉ LE</th>
                <th>VISITES</th>
                <th>NOMMÉES</th>
                <th>ÉTAT</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linkStat: ${linksStats}">
                <td th:text="${linkStat.shortCode}">24f21415-5c73-49be-873e-6f4074b5a8c2</td>
                <td th:text="${linkStat.title}">Vidéo — La borne supérieure</td>
                <td th:text="${linkStat.ue ?: '—'}">Analyse</td>
                <td th:text="${#temporals.format(linkStat.publicationDate, 'd MMM yyyy')}">12 oct. 2026</td>
                <td th:text="${linkStat.visits}">28</td>
                <td th:text="${linkStat.namedVisits}">21</td>
                <td th:text="${linkStat.active ? 'actif' : 'désactivé'}" th:classappend="${!linkStat.active} ? 'off'">actif</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(linksStats)}">
        Aucun lien n'a encore été créé.
    </div>
</main>

</body>
</html>
